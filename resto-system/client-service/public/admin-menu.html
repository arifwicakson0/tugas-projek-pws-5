<!doctype html>
<html>
<head>
  <title>Tambah Menu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
  <h2>Tambah Menu</h2>
  <form method="POST" action="/admin/menu">
    <input name="nama_menu" class="form-control mb-2" placeholder="Nama Menu">
    <input name="harga" type="number" class="form-control mb-2" placeholder="Harga">
    <button class="btn btn-primary">Simpan</button>
  </form>
  <a href="/admin" class="btn btn-secondary mt-2">Kembali</a>
</body>
</html>
