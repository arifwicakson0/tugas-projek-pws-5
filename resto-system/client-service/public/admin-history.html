<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Admin - Riwayat Pesanan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-light bg-white shadow-sm mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">📜 Riwayat Pesanan Masuk</span>
            <div>
                <span id="adminName" class="me-3 fw-bold text-primary"></span>
                <a href="/admin-menu.html" class="btn btn-outline-primary me-2">Kelola Menu</a>
                <button onclick="logout()" class="btn btn-danger">Keluar</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow-sm">
            <div class="card-body">
                <h4 class="card-title mb-4">Daftar Transaksi Terbaru</h4>
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>Waktu</th>
                            <th>Nama Pelanggan</th>
                            <th>Menu Pesanan</th>
                            <th>Harga</th>
                        </tr>
                    </thead>
                    <tbody id="historyList">
                        <tr><td colspan="4" class="text-center">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // --- AMBIL KUNCI DARI HASIL LOGIN ---
        const ADMIN_KEY = localStorage.getItem('my_api_key');
        const USERNAME = localStorage.getItem('my_username');

        // Cek Login
        if (!ADMIN_KEY) {
            alert('Akses Ditolak! Silakan Login sebagai Admin.');
            window.location.href = 'login.html';
        } else {
            document.getElementById('adminName').innerText = "Halo, " + USERNAME;
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        async function loadHistory() {
            try {
                // Request ke Backend menggunakan Kunci Dinamis
                const res = await fetch('http://localhost:3000/api/transactions', {
                    headers: { 'x-api-key': ADMIN_KEY }
                });

                if (!res.ok) {
                    if (res.status === 401) {
                        alert("Sesi habis atau bukan Admin. Silakan login ulang.");
                        logout();
                    }
                    throw new Error('Gagal mengambil data.');
                }

                const data = await res.json();
                const tbody = document.getElementById('historyList');
                tbody.innerHTML = '';

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center">Belum ada pesanan masuk.</td></tr>';
                    return;
                }

                data.forEach(item => {
                    const waktu = new Date(item.created_at).toLocaleString('id-ID', {
                        day: 'numeric', month: 'short', hour: '2-digit', minute:'2-digit'
                    });

                    tbody.innerHTML += `
                        <tr>
                            <td><small class="text-muted">${waktu}</small></td>
                            <td class="fw-bold">${item.customer_name || 'Anonim'}</td>
                            <td>${item.menu_name}</td>
                            <td class="text-success fw-bold">Rp ${parseInt(item.price).toLocaleString('id-ID')}</td>
                        </tr>`;
                });
            } catch (err) { 
                console.error(err);
                document.getElementById('historyList').innerHTML = '<tr><td colspan="4" class="text-center text-danger">Gagal memuat data (Cek Backend).</td></tr>';
            }
        }
        
        // Refresh otomatis setiap 3 detik
        loadHistory();
        setInterval(loadHistory, 3000);
    </script>
</body>
</html>
