<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Menu Restoran</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <span class="navbar-brand mb-0 h1">🍽️ Resto App</span>
    <a href="/admin" class="btn btn-outline-light">Admin</a>
  </div>
</nav>

<div class="container mt-4">
  <h2 class="mb-4">Menu Makanan</h2>

  <div class="row" id="menu-list">
    <!-- Menu akan diisi lewat JavaScript -->
  </div>
</div>

<script>
fetch('/api/menu-client')
  .then(res => res.json())
  .then(data => {
    const menuList = document.getElementById('menu-list');
    menuList.innerHTML = '';

    data.forEach(menu => {
      menuList.innerHTML += `
        <div class="col-md-4">
          <div class="card mb-3 shadow-sm">
            <div class="card-body">
              <h5 class="card-title">${menu.nama_menu}</h5>
              <p class="card-text">Rp ${menu.harga}</p>
              <form method="POST" action="/order">
                <input type="hidden" name="nama_pelanggan" value="Pelanggan">
                <input type="hidden" name="total" value="${menu.harga}">
                <button class="btn btn-primary w-100">Pesan</button>
              </form>
            </div>
          </div>
        </div>
      `;
    });
  });
</script>

</body>
</html>
