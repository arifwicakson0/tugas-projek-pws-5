<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Daftar Akun Baru</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow p-4" style="width: 400px;">
        <h3 class="text-center mb-4">Daftar Akun</h3>
        <form id="regForm">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" id="username" class="form-control" placeholder="Buat nama pengguna" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Buat kata sandi" required>
            </div>

            <div class="mb-4">
                <label class="form-label">Daftar Sebagai:</label>
                <select id="role" class="form-select">
                    <option value="user">🍽️ Pelanggan (User)</option>
                    <option value="admin">👨‍🍳 Pemilik Resto (Admin)</option>
                </select>
            </div>

            <button type="submit" class="btn btn-success w-100">Daftar Sekarang</button>
        </form>
        <p class="text-center mt-3">Sudah punya akun? <a href="login.html">Login disini</a></p>
        <div class="text-center"><a href="/" class="small text-muted">Kembali ke Home</a></div>
    </div>

    <script>
        document.getElementById('regForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value; // Ambil pilihan user/admin

            try {
                const res = await fetch('http://localhost:3000/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, role }) // Kirim role ke backend
                });

                const data = await res.json();
                
                if (res.ok) {
                    alert(`✅ AKUN ${role.toUpperCase()} BERHASIL DIBUAT!\n\nAPI Key Anda: ${data.api_key}\n\nSilakan Login.`);
                    window.location.href = 'login.html';
                } else {
                    alert('❌ Gagal: ' + data.message);
                }
            } catch (err) {
                console.error(err);
                alert('⚠️ Error: Tidak bisa konek ke server backend (Port 3000).');
            }
        });
    </script>
</body>
</html>
