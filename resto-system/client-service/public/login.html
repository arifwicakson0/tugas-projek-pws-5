<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login Pelanggan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow p-4" style="width: 400px;">
        <h3 class="text-center mb-4">Login Restoran</h3>
        <form id="loginForm">
            <div class="mb-3">
                <label>Username</label>
                <input type="text" id="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Password</label>
                <input type="password" id="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Masuk</button>
        </form>
        <p class="text-center mt-3">Belum punya akun? <a href="register.html">Daftar</a></p>
        <div class="text-center"><a href="/" class="small text-muted">Kembali ke Home</a></div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('http://localhost:3000/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (res.ok) {
                    // SIMPAN API KEY KE LOCAL STORAGE BROWSER
                    localStorage.setItem('my_api_key', data.api_key);
                    localStorage.setItem('my_username', data.username);
                    
                    alert('✅ Login Berhasil!\nSelamat datang, ' + data.username);
                    
                    // Pindahkan halaman sesuai role
                    if (data.role === 'admin') {
                        window.location.href = 'admin-menu.html';
                    } else {
                        window.location.href = 'user.html';
                    }
                } else {
                    alert('❌ ' + data.message);
                }
            } catch (err) { alert('Error koneksi backend'); }
        });
    </script>
</body>
</html>
